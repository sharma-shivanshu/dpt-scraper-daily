name: Scheduled Scraper

on:
  workflow_dispatch: {}
  schedule:
    - cron: '30 5 * * *'   # 05:30 UTC -> 11:00 IST
    - cron: '40 6 * * *'  # 06:40 UTC -> 12:10 IST
    - cron: '50 7 * * *'  # 7:50 UTC -> 13:20 IST
    - cron: '50 8 * * *'  # 8:50 UTC -> 14:20 IST
    - cron: '50 9 * * *'  # 9:50 UTC -> 15:20 IST
    - cron: '40 10 * * *'  # 10:40 UTC -> 16:10 IST
    - cron: '30 11 * * *'  # 11:30 UTC -> 17:00 IST

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      GSPREAD_CREDENTIALS_B64: ${{ secrets.GSPREAD_CREDENTIALS_B64 }}
      COOKIES_JSON_B64: ${{ secrets.COOKIES_JSON_B64 }}
      SHEET_KEY: ${{ secrets.SHEET_KEY }}
      SCRAPE_ACCOUNT: bstvlive

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Restore credentials.json
        run: |
          echo "$GSPREAD_CREDENTIALS_B64" | base64 -d > credentials.json
          echo "$COOKIES_JSON_B64" | base64 -d > cookies.json

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'


      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright (Chromium only)
        run: |
          python -m playwright install chromium

      - name: Run scraper
        run: |
          python run.py
          if [ ! -f summary.txt ]; then
            echo "ERROR: summary.txt not created" >&2
            exit 1
          fi

      - name: Upload run summary (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: summary
          path: summary.txt

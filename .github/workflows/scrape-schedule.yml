name: Scheduled Scraper

on:
  workflow_dispatch:
    inputs:
      runner_type:
        description: 'Choose where to run the scraper'
        required: true
        default: 'windows-latest'
        type: choice
        options:
          - windows-latest
          - ubuntu-latest
          - self-hosted

jobs:
  scrape:
    runs-on: ${{ inputs.runner_type || 'windows-latest' }}
    env:
      GSPREAD_CREDENTIALS_B64: ${{ secrets.GSPREAD_CREDENTIALS_B64 }}
      COOKIES_JSON_B64: ${{ secrets.COOKIES_JSON_B64 }}
      SHEET_KEY: ${{ secrets.SHEET_KEY }}
      SCRAPE_ACCOUNT: bstvlive
      PYTHONIOENCODING: 'utf-8'  # Forces Windows to support emojis

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright (Chromium only)
        run: |
          python -m playwright install chromium

      - name: Run scraper
        shell: bash
        run: |
          python run.py
          if [ ! -f summary.txt ]; then
            echo "ERROR: summary.txt not created" >&2
            exit 1
          fi

      - name: Upload run summary (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: summary
          path: summary.txt

name: Scheduled Scraper

on:
  workflow_dispatch: {}
  schedule:
    - cron: '30 7 * * *'   # 07:30 UTC -> 13:00 IST
    - cron: '30 10 * * *'  # 10:30 UTC -> 16:00 IST
    - cron: '10 13 * * *'  # 13:10 UTC -> 18:40 IST

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      GSPREAD_CREDENTIALS_B64: ${{ secrets.GSPREAD_CREDENTIALS_B64 }}
      COOKIES_JSON_B64: ${{ secrets.COOKIES_JSON_B64 }}
      SHEET_KEY: ${{ secrets.SHEET_KEY }}
      SCRAPE_ACCOUNT: bstvlive
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Restore credentials.json
        run: |
          echo "$GSPREAD_CREDENTIALS_B64" | base64 -d > credentials.json
          echo "$COOKIES_JSON_B64" | base64 -d > cookies.json
        shell: bash
        env:
          GSPREAD_CREDENTIALS_B64: ${{ secrets.GSPREAD_CREDENTIALS_B64 }}
          COOKIES_JSON_B64: ${{ secrets.COOKIES_JSON_B64 }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install apt deps (chromium + driver)
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser chromium-chromedriver libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libxss1 libasound2 libx11-xcb1 libgtk-3-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          python -m playwright install --with-deps

      - name: Run scraper
        id: run_scraper
        run: |
          python run.py
          if [ ! -f summary.txt ]; then
            echo "ERROR: summary.txt not created" >&2
            exit 1
          fi

      - name: Upload run summary (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: summary
          path: summary.txt

      - name: Read summary for email
        id: get_summary
        run: |
          echo "summary<<EOF" >> $GITHUB_OUTPUT
          cat summary.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Send email with summary
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Scraper report — run ${{ github.run_number }}"
          to: ${{ secrets.NOTIFY_TO }}
          from: ${{ secrets.SMTP_USERNAME }}
          body: |
            Scraper run completed. Summary:
            ${{ steps.get_summary.outputs.summary }}

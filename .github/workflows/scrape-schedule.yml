name: Scheduled Scraper

on:
  workflow_dispatch: {}
  schedule:
    - cron: '00 6 * * *'   # 06:00 UTC -> 11:30 IST
    - cron: '00 7 * * *'  # 07:00 UTC -> 12:30 IST
    - cron: '00 8 * * *'  # 8:00 UTC -> 13:30 IST
    - cron: '00 9 * * *'  # 9:00 UTC -> 14:30 IST
    - cron: '00 10 * * *'  # 10:00 UTC -> 15:30 IST
    - cron: '00 11 * * *'  # 11:00 UTC -> 16:30 IST
    - cron: '00 12 * * *'  # 12:00 UTC -> 17:30 IST

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      GSPREAD_CREDENTIALS_B64: ${{ secrets.GSPREAD_CREDENTIALS_B64 }}
      COOKIES_JSON_B64: ${{ secrets.COOKIES_JSON_B64 }}
      SHEET_KEY: ${{ secrets.SHEET_KEY }}
      SCRAPE_ACCOUNT: bstvlive

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Restore credentials.json
        run: |
          echo "$GSPREAD_CREDENTIALS_B64" | base64 -d > credentials.json
          echo "$COOKIES_JSON_B64" | base64 -d > cookies.json

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install apt deps (Chromium + libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser chromium-chromedriver \
            libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libxss1 libasound2t64 libx11-xcb1 libgtk-3-0 libffi8 \
            libx264-dev || true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright (Chromium only)
        run: |
          python -m playwright install chromium

      - name: Run scraper
        run: |
          python run.py
          if [ ! -f summary.txt ]; then
            echo "ERROR: summary.txt not created" >&2
            exit 1
          fi

      - name: Upload run summary (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: summary
          path: summary.txt
